services:
  account-micro-service:
    build:
      context: ./account
      dockerfile: Dockerfile
    container_name: account-micro-service
    ports:
      - "8081:8080"
    networks:
      - microservices-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    networks:
      - microservices-network
networks:
  microservices-network:
    driver: bridge
