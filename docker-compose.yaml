services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - microservices-network
    depends_on:
      - api-gateway

  account-micro-service:
    build:
      context: ./account
      dockerfile: Dockerfile
    container_name: account-micro-service
    ports:
      - "8081:8080"
    networks:
      - microservices-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    networks:
      - microservices-network
networks:
  microservices-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
