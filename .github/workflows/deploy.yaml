name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/backend
            git pull
            cd account && ./mvnw clean package -DskipTests && touch target/*.jar && cd ..
            cd api-gateway && ./mvnw clean package -DskipTests && touch target/*.jar && cd ..
            docker compose up -d --build
